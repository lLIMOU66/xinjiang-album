<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>螳螂的旅行 · 相册</title>
<meta name="description" content="螳螂的旅行档案：按行程整理的照片与视频相册。" />
<meta name="theme-color" content="#0d1428" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="theme.css" />
</head>
<body class="page-album">

<!-- 滚动进度 -->
<div class="progress" id="progress"></div>

<!-- 顶部导航 -->
<header class="nav" id="nav">
  <a class="brand" href="index.html">螳螂<span>·</span>旅行</a>
  <nav class="nav-links">
    <a href="#works">行程 <i>01</i></a>
    <a href="#about">关于 <i>02</i></a>
    <a class="nav-home" href="index.html">全部旅行 ←</a>
  </nav>
</header>

<!-- 背景音乐：悬浮唱片按钮 -->
<button class="music-fab" id="music" type="button" aria-label="播放/暂停背景音乐" aria-pressed="false" data-label="背景音乐">
  <span class="mf-ring" aria-hidden="true"></span>
  <span class="mf-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
</button>

<!-- 首屏：该旅行精选封面 -->
<section class="hero" id="top">
  <img class="hero-img" id="heroImg" src="" alt="" fetchpriority="high" />
  <div class="hero-veil"></div>
  <span class="hero-side" id="heroSide"></span>

  <div class="hero-copy">
    <p class="eyebrow" id="heroEyebrow"></p>
    <h1 id="heroTitle"></h1>
    <p class="sub" id="heroSub"></p>
  </div>

  <div class="hero-foot">
    <div class="hero-facts" id="heroFacts"></div>
    <a class="hero-scroll" href="#works">向下滚动 <span>↓</span></a>
  </div>
</section>

<!-- 行程 -->
<section class="works" id="works">
  <header class="section-head">
    <div class="sh-left">
      <span class="sec-no">01</span>
      <span class="sec-en">WORKS / 行程</span>
    </div>
    <div class="sh-right">
      <h2 id="worksTitle"></h2>
      <p class="lead" id="worksLead"></p>
    </div>
  </header>

  <div class="filters" id="filters" role="tablist"></div>
  <div class="grid" id="grid"></div>
  <div class="grid-end"><span>END OF INDEX</span><span id="gridCount"></span></div>
</section>

<!-- 关于 / 收尾 -->
<section class="about" id="about">
  <header class="section-head">
    <div class="sh-left">
      <span class="sec-no">02</span>
      <span class="sec-en">ARCHIVE / 关于</span>
    </div>
    <div class="sh-right">
      <h2>照片，<em>会记得。</em></h2>
      <p class="lead" id="aboutLead">原片留在本地，这里只放为网页重新压制的版本。</p>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <footer class="colophon">
    <div class="co-item"><b id="coName">螳螂的旅行</b><span id="coLine"></span></div>
    <div class="co-item"><b>媒体规格</b><span>照片 WebP · 视频 1080p</span></div>
    <div class="co-item"><b>音乐</b><span>Ayasa绚沙 · VOICES (Strings ver.)</span></div>
    <a class="to-top" href="index.html">全部旅行 ↑</a>
  </footer>
</section>

<!-- 详情 -->
<div class="detail" id="detail" aria-hidden="true">
  <div class="detail-bar">
    <button class="detail-back" id="detailBack" type="button">← 返回行程</button>
    <span class="detail-title" id="detailTitle"></span>
    <button class="detail-x" id="detailX" type="button" aria-label="关闭">✕</button>
  </div>
  <div class="detail-body" id="detailBody"></div>
</div>

<!-- 灯箱 -->
<div class="lb" id="lb" aria-hidden="true">
  <button class="lb-x" id="lbX" aria-label="关闭">✕</button>
  <button class="lb-prev" id="lbPrev" aria-label="上一张">‹</button>
  <div class="lb-stage">
    <img class="lb-img" id="lbImg" alt="" />
    <video class="lb-video" id="lbVideo" controls playsinline hidden></video>
  </div>
  <button class="lb-next" id="lbNext" aria-label="下一张">›</button>
  <div class="lb-bar"><span id="lbCap"></span><span id="lbCount"></span></div>
</div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="album.js"></script>
</body>
</html>
